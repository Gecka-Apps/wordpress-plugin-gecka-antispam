# Publishes a release on WordPress.org: run by hand, from the Actions tab, on
# the tag of the release (vX.Y.Z). GitLab can publish the same way; whichever
# runs second finds the version already on WordPress.org and stops.
#
# Secrets: SVN_USERNAME, the WordPress.org account, and SVN_PASSWORD, the
# SVN password of that account (Account & Security on WordPress.org).

name: Publish on WordPress.org

on:
  workflow_dispatch:

concurrency:
  group: wordpress-org
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - name: On a release tag
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          echo "Run this workflow on the tag of the release (vX.Y.Z), not on ${{ github.ref_name }}" >&2
          exit 1

      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, mbstring
          coverage: none

      - name: Versions
        id: version
        run: echo "version=$(bin/check-version '${{ github.ref_name }}')" >> "$GITHUB_OUTPUT"

      - name: Not published yet
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://plugins.svn.wordpress.org/gecka-antispam/tags/${{ steps.version.outputs.version }}/")
          if [ "$status" != 404 ]; then
            echo "tags/${{ steps.version.outputs.version }} answers $status on WordPress.org: already published, or SVN unreachable" >&2
            exit 1
          fi

      - name: Install dependencies
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Package
        run: bin/package build/gecka-antispam

      - uses: 10up/action-wordpress-plugin-deploy@stable
        id: deploy
        with:
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: gecka-antispam
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_DIR: build/gecka-antispam

      - uses: actions/upload-artifact@v4
        with:
          name: gecka-antispam-${{ steps.version.outputs.version }}
          path: ${{ steps.deploy.outputs.zip-path }}
